[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora"
version = "0.1.0"
description = "Pandora quantum circuit tooling"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "asyncpg>=0.31.0",
    "color-code-stim>=1.1.1",
    "gmpy2>=2.3.1",
    "mqt-qcec>=3.9.0",
    "numpy>=1.26.4",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytket>=2.18.1",
    "pyzx==0.10.4",
    "qiskit==1.4.4",
    "qiskit-qasm3-import>=0.6.0",
    "qualtran==0.6.1",
    "quizx==0.4.0",
    "requests>=2.34.2",
    "stimcirq>=1.16.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pandora*", "pyLIQTR*"]

[tool.setuptools.package-data]
mypackage = ["src/pandora/db/generic_procedures/**.sql"]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora"
version = "0.1.0"
description = "Pandora demo tools from liblsqecc"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "ioanamoflic" } ]
dependencies = [
	"asyncpg",
	"psycopg2-binary",
	"requests",
	"gmpy2",
	"mqt.qcec",
	"qiskit_qasm3_import",
	"pytket",
    "qiskit==1.4.4", # benchmarks
    "pytest",
    "pytest-asyncio",
]

# TODO: set RSA as default optional dependency when PEP 771 implemented:
# https://peps.python.org/pep-0771/
# default-optional-dependency-keys = [ "rsa" ]

[project.optional-dependencies]
# RSA mode uses newer qualtran
rsa = ["qualtran==0.6.1"]

# Fermi-Hubbard mode: pyliqtr currently depends on an older qualtran incompatible with RSA mode
fh = ["pyliqtr==1.4.1", "qualtran==0.4"]

[tool.setuptools.packages.find]
where = ["src"]

