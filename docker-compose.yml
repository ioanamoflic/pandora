services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: moflici1
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moflici1 -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10